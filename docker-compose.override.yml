# docker-compose.override.yml
# Place this in the same directory as your Nextcloud AIO docker-compose.yml
# Then apply with:  docker compose up -d

services:
  nextcloud-aio-mastercontainer:
    environment:
      # Allow this host path (and anything below it) to be used as "Local" external storage
      NEXTCLOUD_MOUNT: "/tank/docker/data/immich/library"
